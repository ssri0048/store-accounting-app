<title>บัญชีร้าน — My Store Accounting</title>
<style>
:root{
  --green:#1a7f5a; --green-dk:#136647; --red:#d9534f; --amber:#e8a11c;
  --bg:#f6f7f8; --card:#ffffff; --line:#e5e8ea; --txt:#20302b; --mut:#6b7a75;
  --radius:14px; --nav-h:64px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Noto Sans Thai','Sarabun',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:16px;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);border-color:var(--green)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px;font-weight:600}
label .req{color:var(--red)}
.help{font-size:12px;color:var(--mut);margin-top:3px}
.topbar{position:sticky;top:0;z-index:50;background:var(--green);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .backbtn{background:none;border:none;color:#fff;font-size:22px;padding:4px 8px 4px 0}
.topbar .sync{font-size:11px;background:rgba(255,255,255,.18);padding:4px 8px;border-radius:20px}
.wrap{padding:14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.stat .lbl{font-size:12px;color:var(--mut)}
.stat .val{font-size:20px;font-weight:800;margin-top:2px}
.pos{color:var(--green)} .neg{color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700}
.btn-p{background:var(--green);color:#fff}
.btn-p:active{background:var(--green-dk)}
.btn-s{background:#eaf4f0;color:var(--green)}
.btn-t{background:none;color:var(--mut)}
.btn-d{background:#fdecec;color:var(--red)}
.btn-block{width:100%}
.btn[disabled]{opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:9px 14px;font-size:14px;color:var(--txt);font-weight:600}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.item{display:flex;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ic-in{background:#e5f4ec} .ic-ex{background:#fdecec} .ic-doc{background:#eef1fb}
.item .main{flex:1;min-width:0}
.item .t1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:800;font-size:15px;text-align:right}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
.b-ok{background:#e5f4ec;color:var(--green)}
.b-warn{background:#fdf3dd;color:#96700f}
.b-err{background:#fdecec;color:var(--red)}
.b-mut{background:#eef0f1;color:var(--mut)}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;z-index:60}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--mut);font-size:11px;font-weight:600}
.nav a.on{color:var(--green)}
.nav a .nic{font-size:21px;line-height:1}
.nav .fab{margin-top:-24px}
.nav .fab .nic{width:52px;height:52px;background:var(--green);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(26,127,90,.4)}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}
.empty .em-ic{font-size:44px;margin-bottom:8px}
.toast{position:fixed;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#243430;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:200;max-width:88%;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:88vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:17px;margin-bottom:8px}
.sheet .closex{position:sticky;float:right;top:0;background:#eef0f1;border:none;width:32px;height:32px;border-radius:50%;font-size:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto}
.tabs button{background:none;border:none;padding:10px 12px;font-size:14px;font-weight:700;color:var(--mut);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--green);border-bottom-color:var(--green)}
.searchbar{display:flex;gap:8px;margin-bottom:10px}
.skel{height:70px;border-radius:var(--radius);background:linear-gradient(90deg,#ececec,#f6f6f6,#ececec);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.conf-lo{background:#fdf3dd;border:1px solid #e8c877 !important}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--txt);font-weight:600}
.menu-item .mi{font-size:20px;width:32px;text-align:center}
.menu-item .arr{margin-left:auto;color:var(--mut)}
table.rep{width:100%;border-collapse:collapse;font-size:13.5px}
table.rep th{text-align:left;padding:7px 6px;border-bottom:2px solid var(--line);font-size:12px;color:var(--mut)}
table.rep td{padding:7px 6px;border-bottom:1px solid var(--line)}
table.rep td.num,table.rep th.num{text-align:right}
.offline-bar{background:#96700f;color:#fff;text-align:center;font-size:13px;padding:6px;display:none}
/* ---- UI polish (cosmetic only) ---- */
#view>.grid2{margin-bottom:12px}
.grid2>div:not(.stat),.grid3>div:not(.stat){min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.grid2>div:not(.stat)>label,.grid3>div:not(.stat)>label{margin-top:0}
input[type="date"],input[type="month"]{-webkit-appearance:none;appearance:none;min-width:0;min-height:47px;background:#fff}
.grid2 input,.grid2 select,.grid3 input,.grid3 select{min-width:0}
.stat{padding:14px;box-shadow:0 1px 2px rgba(18,60,42,.05)}
.stat .val{margin-top:4px}
.card{box-shadow:0 1px 2px rgba(18,60,42,.04)}
.item .amt{flex-shrink:0;margin-left:4px}
.chip.on{box-shadow:0 2px 6px rgba(26,127,90,.25)}
.sheet h3{margin-top:2px}
@media print{
  .topbar,.nav,.no-print,.offline-bar{display:none !important}
  body{background:#fff;padding:0}
  .card{border:none;page-break-inside:avoid}
}
@media(min-width:768px){ .wrap{padding:20px} }
</style>
</head>

/* ================== HELPERS ================== */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmtMoney(n){ n = Number(n)||0; return n.toLocaleString('th-TH',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtMoney0(n){ n = Number(n)||0; return n.toLocaleString('th-TH',{maximumFractionDigits:2}); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){
  if(!iso) return '-';
  var p = String(iso).slice(0,10).split('-');
  if(p.length<3) return iso;
  var y = parseInt(p[0],10);
  if(S.prefs.year_format==='be') y += 543;
  return p[2]+'/'+p[1]+'/'+y;
}
function monthStartISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'; }
function toast(msg, ms){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){t.remove();}, ms||2600);
}
function uuid(){ return crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2); }

/* REST helper */
function api(path, opts){
  opts = opts || {};
  var h = { 'apikey': CFG.key, 'Authorization': 'Bearer '+CFG.key, 'Content-Type': 'application/json' };
  if(opts.prefer) h['Prefer'] = opts.prefer;
  return fetch(CFG.url + '/rest/v1/' + path, {
    method: opts.method || 'GET',
    headers: h,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error('API '+r.status+': '+t.slice(0,200)); });
    if(r.status===204) return null;
    var cr = r.headers.get('content-range');
    return r.text().then(function(t){ var d = t? JSON.parse(t): null; if(d && cr) d.__count = cr; return d; });
  });
}
function count(table, filter){
  var h = { 'apikey': CFG.key, 'Authorization': 'Bearer '+CFG.key, 'Prefer':'count=exact', 'Range':'0-0' };
  return fetch(CFG.url+'/rest/v1/'+table+'?select=id'+(filter?'&'+filter:''), {headers:h}).then(function(r){
    var cr = r.headers.get('content-range')||'/0';
    return parseInt(cr.split('/')[1],10)||0;
  }).catch(function(){ return -1; });
}
function audit(action, entity, entity_id, detail){
  api('audit_log', {method:'POST', body:{action:action, entity:entity, entity_id:String(entity_id||''), detail:detail||{}, actor:S.user||'unknown'}}).catch(function(){});
}

var routes = {};

function nav(hash){ location.hash = hash; }
window.addEventListener('hashchange', render);
window.addEventListener('online', function(){ document.getElementById('offlineBar').style.display='none'; toast('กลับมาออนไลน์แล้ว ✓'); });
window.addEventListener('offline', function(){ document.getElementById('offlineBar').style.display='block'; });

function setTop(title, back, extra){
  var el = document.getElementById('topbar');
  el.innerHTML = (back? '<button class="backbtn" onclick="history.back()">‹</button>':'') +
    '<h1>'+esc(title)+'</h1>' + (extra||'') +
    '<span class="sync" id="syncBadge">●</span>';
  var sb = document.getElementById('syncBadge');
  sb.textContent = navigator.onLine ? 'ออนไลน์' : 'ออฟไลน์';
  sb.style.background = navigator.onLine ? 'rgba(255,255,255,.18)' : '#96700f';
}
function render(){
  var h = location.hash.replace('#','') || '/home';
  var seg = h.split('/').filter(Boolean);
  var page = seg[0] || 'home';
  var navEl = document.querySelector('nav.nav');
  if(navEl && page!=='pos' && navEl.dataset.mode==='pos'){
    navEl.innerHTML = BO_NAV_HTML;
    navEl.dataset.mode = 'bo';
  }
  document.querySelectorAll('.nav a').forEach(function(a){
    a.classList.toggle('on', a.dataset.nav===page);
  });
  var fn = routes[page] || routes.home;
  fn(seg.slice(1));
  window.scrollTo(0,0);
}
function V(html){ document.getElementById('view').innerHTML = html; }

function boot(){
  if(!navigator.onLine) document.getElementById('offlineBar').style.display='block';
  function loadCore(){
    return Promise.all([
      api('settings?select=*'),
      api('categories?select=*&active=eq.true&order=kind,sort')
    ]);
  }
  loadCore().catch(function(){
    return new Promise(function(resolve){ setTimeout(resolve, 900); }).then(loadCore);
  }).then(function(res){
    (res[0]||[]).forEach(function(r){
      if(r.key==='prefs') S.prefs = Object.assign(S.prefs, r.value||{});
      if(r.key==='store') S.store = Object.assign(S.store, r.value||{});
      if(r.key==='drive' && r.value && r.value.root_url) CFG.driveUrl = r.value.root_url;
      if(r.key==='auth') S.auth = r.value||{};
      if(r.key==='pos_shop') S.pos_shop = r.value||{};
    });
    S.cats = res[1]||[];
    gate();
    render();
  }).catch(function(e){
    gate();
    render();
    toast('เชื่อมต่อฐานข้อมูลไม่ได้ — กดรีเฟรชหน้าอีกครั้ง');
  });
}

function periodRangeFromState(){
  var p = S.homePeriod || {mode:'month', value: monthStartISO().slice(0,7)};
  if(p.mode==='day'){
    var from = p.value;
    var d = new Date(p.value+'T00:00:00');
    var nd = new Date(d.getTime()+86400000);
    var to = nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')+'-'+String(nd.getDate()).padStart(2,'0');
    return {from:from, to:to, label: fmtDate(from)};
  }
  var ym = p.value.split('-'); var y=Number(ym[0]), mo=Number(ym[1]);
  var from = ym[0]+'-'+ym[1]+'-01';
  var nmo = mo===12?1:mo+1, ny = mo===12?y+1:y;
  var to = ny+'-'+String(nmo).padStart(2,'0')+'-01';
  var yLabel = S.prefs.year_format==='be' ? y+543 : y;
  return {from:from, to:to, label:'เดือน '+ym[1]+'/'+yLabel};
}
function setPeriodMode(mode){
  S.homePeriod = S.homePeriod || {};
  S.homePeriod.mode = mode;
  S.homePeriod.value = mode==='day' ? todayISO() : monthStartISO().slice(0,7);
  var bm = document.getElementById('periodModeMonth'), bd = document.getElementById('periodModeDay');
  if(bm) bm.classList.toggle('on', mode==='month');
  if(bd) bd.classList.toggle('on', mode==='day');
  var inp = document.getElementById('periodInput');
  if(inp){ inp.type = mode==='day' ? 'date' : 'month'; inp.value = S.homePeriod.value; }
  loadPeriodCard();
}
function onPeriodInputChange(val){
  if(!val) return;
  S.homePeriod = S.homePeriod || {mode:'month'};
  S.homePeriod.value = val;
  loadPeriodCard();
}
function loadPeriodCard(){
  var body = document.getElementById('periodCardBody');
  var titleEl = document.getElementById('periodTitle');
  if(!body) return;
  var r = periodRangeFromState();
  if(titleEl) titleEl.textContent = '📅 '+r.label;
  body.innerHTML = '<div class="skel"></div>';
  api('transactions?select=txn_type,amount&txn_date=gte.'+r.from+'&txn_date=lt.'+r.to+'&limit=5000').then(function(rows){
    var pi=0, pe=0;
    (rows||[]).forEach(function(x){
      var isIncome = (x.txn_type==='income'||x.txn_type==='sale'||x.txn_type==='transfer_in');
      var a = Number(x.amount)||0;
      if(isIncome) pi+=a; else pe+=a;
    });
    body.innerHTML = '<div class="grid2"><div><div class="help">รายรับ</div><b class="pos">฿'+fmtMoney0(pi)+'</b></div>'
      + '<div><div class="help">รายจ่าย</div><b class="neg">฿'+fmtMoney0(pe)+'</b></div></div>';
  }).catch(function(){
    body.innerHTML = '<div class="help">โหลดข้อมูลช่วงนี้ไม่ได้</div>';
  });
}
function txnItem(r){
  var isIn = (r.txn_type==='income'||r.txn_type==='sale'||r.txn_type==='transfer_in');
  var st = r.review_status==='pending' ? '<span class="badge b-warn">รอตรวจ</span>' : '';
  var nb = (r.document_id===null && (r.txn_type==='expense'||r.txn_type==='purchase')) ? ' <span class="badge b-warn">🧾 ไม่มีบิล</span>' : '';
  return '<div class="item" onclick="openTxn(\''+r.id+'\')">'
    + '<div class="ic '+(isIn?'ic-in':'ic-ex')+'">'+(isIn?'💰':'🧾')+'</div>'
    + '<div class="main"><div class="t1">'+esc(r.party_name||r.category_name||r.description||'-')+'</div>'
    + '<div class="t2">'+fmtDate(r.txn_date)+' · '+esc(r.category_name||'')+' '+st+nb+'</div></div>'
    + '<div class="amt '+(isIn?'pos':'neg')+'">'+(isIn?'+':'−')+'฿'+fmtMoney0(r.amount)+'</div></div>';
}

function setListType(tp){ S.lastList.type=tp; routes.list(); }
function debounce(fn,ms){ var t; return function(){ var a=arguments,c=this; clearTimeout(t); t=setTimeout(function(){fn.apply(c,a);},ms); }; }
function loadList(){
  var f=S.lastList, q='transactions?select=*&order=txn_date.desc,created_at.desc&limit=200';
  if(f.type) q+=(f.type==='expense'?'&txn_type=in.(expense,purchase)':'&txn_type=eq.'+f.type);
  if(f.pending) q+='&review_status=eq.pending';
  if(f.nodoc) q+='&document_id=is.null&txn_type=in.(expense,purchase)';
  if(f.from) q+='&txn_date=gte.'+f.from;
  if(f.to) q+='&txn_date=lte.'+f.to;
  if(f.q){ var s=encodeURIComponent('%'+f.q+'%'); q+='&or=(party_name.ilike.'+s+',category_name.ilike.'+s+',description.ilike.'+s+',doc_no.ilike.'+s+',note.ilike.'+s+')'; }
  api(q).then(function(rows){
    rows = rows||[];
    var el=document.getElementById('listBody'); if(!el) return;
    if(!rows.length){ el.innerHTML='<div class="empty"><div class="em-ic">🔎</div>ไม่พบรายการตามเงื่อนไข<br><br><button class="btn btn-p" onclick="location.hash=\'#/add\'">เพิ่มรายการใหม่</button></div>'; return; }
    var sum=0; rows.forEach(function(r){ var isIn=(r.txn_type==='income'||r.txn_type==='sale'||r.txn_type==='transfer_in'); sum += (isIn?1:-1)*(Number(r.amount)||0); });
    el.innerHTML = '<div class="help" style="margin-bottom:6px">'+rows.length+' รายการ · สุทธิ <b class="'+(sum>=0?'pos':'neg')+'">฿'+fmtMoney0(sum)+'</b></div>' + rows.map(txnItem).join('');
  }).catch(function(e){ var el=document.getElementById('listBody'); if(el) el.innerHTML='<div class="empty">โหลดไม่สำเร็จ<br><button class="btn btn-s" style="margin-top:10px" onclick="loadList()">ลองอีกครั้ง</button></div>'; });
}

function saveTxn(){
  if(saving) return;

    vat_amount:vat, before_vat:before,
    payment_method:f.payment_method, category_name:f.category_name,
    party_name:f.party_name||null, tax_id:f.tax_id||null, doc_no:f.doc_no||null,
    channel:f.channel||null, description:f.description||null, note:f.note||null,
    document_id: addState.docId||null,
    review_status:'reviewed', created_by:S.user||'unknown',
    source: addState.docId? 'ocr':'manual', updated_at:new Date().toISOString()
  };
  var dupCheck = addState.editing ? Promise.resolve([]) :
    api('transactions?select=id&txn_date=eq.'+f.txn_date+'&amount=eq.'+f.amount+'&txn_type=eq.'+f.txn_type+'&limit=1');

      saving=false; btn.disabled=false; btn.textContent='💾 บันทึก';
      sheet('<h3>⚠️ อาจเป็นรายการซ้ำ</h3><div class="help">พบรายการประเภทเดียวกัน ยอดเท่ากัน วันเดียวกันอยู่แล้ว ต้องการบันทึกซ้ำหรือไม่?</div>'
        + '<div class="grid2" style="margin-top:14px"><button class="btn btn-t" onclick="closeSheet()">ยกเลิก</button>'
        + '<button class="btn btn-p" onclick="window.__dupOk=true;closeSheet();saveTxn()">บันทึกต่อ (ไม่ซ้ำ)</button></div>');
      return null;
    }
    window.__dupOk=false;
    var req = addState.editing
      ? api('transactions?id=eq.'+addState.editing, {method:'PATCH', body:body, prefer:'return=representation'})
      : api('transactions', {method:'POST', body:body, prefer:'return=representation'});
    return req.then(function(rows){
      var id = rows && rows[0] && rows[0].id;
      audit(addState.editing?'update':'create','transaction',id,{amount:f.amount,type:f.txn_type});
      if(addState.docId) api('documents?id=eq.'+addState.docId, {method:'PATCH', body:{status:'linked', updated_at:new Date().toISOString()}}).catch(function(){});
      localStorage.removeItem('sa_draft');
      sheet('<h3>✅ บันทึกสำเร็จ</h3><div class="help">'+(f.txn_type==='income'||f.txn_type==='sale'?'รายรับ':'รายจ่าย')+' ฿'+fmtMoney(f.amount)+' · '+fmtDate(f.txn_date)+'</div>'
        + '<div style="margin-top:14px;display:grid;gap:8px">'
        + '<button class="btn btn-p" onclick="closeSheet();addState={docId:null};renderAddForm({txn_type:\''+f.txn_type+'\',txn_date:todayISO()})">เพิ่มรายการต่อ</button>'
        + '<button class="btn btn-s" onclick="closeSheet();nav(\'#/list\')">ดูรายการทั้งหมด</button>'
        + '<button class="btn btn-t" onclick="closeSheet();nav(\'#/home\')">กลับหน้าหลัก</button></div>');
    });
  }).catch(function(e){
    toast('บันทึกไม่สำเร็จ: '+e.message.slice(0,80));
  }).finally(function(){
    saving=false; var b=document.getElementById('saveBtn'); if(b){ b.disabled=false; b.textContent='💾 บันทึก'; }
  });
}

/* ============ FILE ATTACH + OCR ============ */
function resizeImage(file, maxDim){
  return new Promise(function(resolve){
    if(file.type==='application/pdf' || file.size < 400000){
      var fr=new FileReader(); fr.onload=function(){ resolve({dataUrl:fr.result, mime:file.type}); }; fr.readAsDataURL(file); return;
    }
    var img=new Image(); var url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.width,h=img.height, sc=Math.min(1, maxDim/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve({dataUrl:c.toDataURL('image/jpeg',0.82), mime:'image/jpeg'});
    };
    img.onerror=function(){ var fr=new FileReader(); fr.onload=function(){ resolve({dataUrl:fr.result, mime:file.type}); }; fr.readAsDataURL(file); };
    img.src=url;
  });
}
function attachFile(input){
  var file = input.files && input.files[0]; if(!file) return;
  var st = document.getElementById('docStatus'); st.textContent='⏳ กำลังอัปโหลด '+file.name+' ...';
  resizeImage(file, 1600).then(function(res){
    var b64 = res.dataUrl.split(',')[1];
    var ext = res.mime==='application/pdf'?'pdf':'jpg';
    var d = new Date();
    var path = d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+uuid()+'.'+ext;
    var bytes = Uint8Array.from(atob(b64), function(c){return c.charCodeAt(0);});
    return fetch(CFG.url+'/storage/v1/object/receipts/'+path, {
      method:'POST',
      headers:{ 'apikey':CFG.key, 'Authorization':'Bearer '+CFG.key, 'Content-Type':res.mime },
      body: bytes
    }).then(function(r){
      if(!r.ok) throw new Error('อัปโหลดไม่สำเร็จ ('+r.status+')');
      return api('documents', {method:'POST', prefer:'return=representation', body:{
        storage_path:path, file_name:file.name, mime_type:res.mime, file_size:file.size,
        ocr_status:'pending', status:'inbox', created_by:S.user||'unknown'
      }});
    }).then(function(rows){
      addState.docId = rows[0].id; addState.docB64 = b64; addState.docMime = res.mime;
      st.innerHTML = '📎 แนบแล้ว: '+esc(file.name)+' <span class="badge b-ok">อัปโหลดสำเร็จ</span>';
      var ob=document.getElementById('ocrBtn'); if(ob) ob.disabled=false;
      audit('upload','document',rows[0].id,{name:file.name});
      toast('อัปโหลดไฟล์สำเร็จ — กด "อ่านด้วย AI" เพื่อดึงข้อมูลอัตโนมัติ');
    });
  }).catch(function(e){
    st.innerHTML = '<span class="badge b-err">อัปโหลดไม่สำเร็จ</span> '+esc(e.message)+' <button class="btn btn-t" onclick="document.getElementById(\'f_file\').click()">ลองใหม่</button>';
  });
}
function runOcrOnAttached(){
  if(!addState.docB64){ toast('ยังไม่มีไฟล์รูปที่จะอ่าน (แนบรูปใหม่อีกครั้ง)'); return; }
  var out=document.getElementById('ocrResult');
  out.innerHTML='<div class="help" style="margin-top:8px">🤖 AI กำลังอ่านเอกสาร... (ประมาณ 5-15 วินาที)</div>';
  fetch(CFG.fnUrl+'/ocr', {
    method:'POST',
    headers:{ 'apikey':CFG.key, 'Authorization':'Bearer '+CFG.key, 'Content-Type':'application/json' },
    body: JSON.stringify({ image_base64:addState.docB64, mime_type:addState.docMime||'image/jpeg' })
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
  .then(function(res){
    if(!res.ok || res.j.error){ throw new Error(res.j.error||('OCR ผิดพลาด')); }
    var d = res.j.data || res.j;
    applyOcr(d);
    if(addState.docId){
      api('documents?id=eq.'+addState.docId, {method:'PATCH', body:{
        ocr_status:'done', ocr_json:d, doc_type:d.doc_type||'unknown',
        ocr_confidence:d.confidence||null, ocr_text:d.raw_text||null, updated_at:new Date().toISOString()
      }}).catch(function(){});
    }
  }).catch(function(e){
    if(addState.docId) api('documents?id=eq.'+addState.docId,{method:'PATCH',body:{ocr_status:'failed'}}).catch(function(){});
    out.innerHTML='<div class="badge b-err" style="margin-top:8px">OCR ไม่สำเร็จ</div> <span class="help">'+esc(e.message)+'</span>'
      + '<div class="grid2" style="margin-top:8px"><button class="btn btn-s" onclick="runOcrOnAttached()">ลองอีกครั้ง</button>'
      + '<button class="btn btn-t" onclick="document.getElementById(\'ocrResult\').innerHTML=\'\'">กรอกเองต่อ</button></div>';
  });
}
function applyOcr(d){
  var out=document.getElementById('ocrResult');
  var conf = d.confidence!=null ? Math.round(d.confidence*100) : null;
  function setV(id, v){ var e=document.getElementById(id); if(e && v!=null && v!=='') { e.value=v; if(conf!=null && conf<70) e.classList.add('conf-lo'); } }
  setV('f_amount', d.total);
  setV('f_party', d.vendor_name);
  setV('f_docno', d.doc_no);
  setV('f_taxid', d.tax_id);
  if(d.date_iso) setV('f_date', d.date_iso);
  updBE();
  if(d.vat && d.vat>0){ var cb=document.getElementById('f_vat'); if(cb) cb.checked=true; document.getElementById('adv').style.display='block'; }
  var items = (d.items||[]).map(function(it){ return esc(it.name||'')+' ×'+(it.qty||1)+' = ฿'+fmtMoney0(it.amount||0); }).join('<br>');
  out.innerHTML = '<div style="margin-top:10px;padding:10px;background:#f2f8f5;border-radius:10px">'
    + '<b>🤖 AI อ่านได้:</b> <span class="badge '+(conf==null?'b-mut':conf>=70?'b-ok':'b-warn')+'">ความมั่นใจ '+(conf==null?'?':conf+'%')+'</span>'
    + '<div class="help" style="margin-top:6px">ประเภท: '+esc(d.doc_type||'ไม่ทราบ')+' · วันที่ในเอกสาร: '+esc(d.date_original||d.date_iso||'-')+'</div>'
    + (items? '<div class="help" style="margin-top:4px">'+items+'</div>':'')
    + '<div class="help" style="margin-top:6px;color:#96700f">⚠️ กรุณาตรวจสอบข้อมูลก่อนกดบันทึกทุกครั้ง — ช่องสีเหลือง = ความมั่นใจต่ำ</div></div>';
  toast('AI กรอกข้อมูลให้แล้ว โปรดตรวจสอบก่อนบันทึก');
}
function openDocFile(docId){
  var w = window.open('about:blank','_blank');
  api('documents?select=storage_path,drive_url&id=eq.'+docId).then(function(rows){
    var r=rows&&rows[0];
    if(!r){ if(w) w.close(); toast('ไม่พบเอกสาร'); return; }
    var u = r.storage_path? (CFG.url+'/storage/v1/object/public/receipts/'+r.storage_path) : r.drive_url;
    if(!u){ if(w) w.close(); toast('เอกสารนี้ไม่มีไฟล์แนบ'); return; }
    if(w){ w.location = u; } else { window.location.href = u; }
  }).catch(function(){ if(w) w.close(); toast('เปิดเอกสารไม่สำเร็จ ลองอีกครั้ง'); });

routes.prod = function(args){
  if(args && args[0]) return prodDetail(args[0]);
  setTop('สินค้าและสูตร', true);
  V('<div class="row" style="margin-bottom:10px"><b style="flex:1">สินค้าทั้งหมด</b><button class="btn btn-p" onclick="prodForm()">＋ เพิ่มสินค้า</button></div>'
    + '<div id="prodBody"><div class="skel"></div></div>');
  Promise.all([
    api('products?select=*&active=eq.true&order=name'),
    api('recipe_items?select=*'),
    api('ingredients?select=id,name_th,cost_per_use_unit,use_unit')
  ]).then(function(res){
    var prods=res[0]||[], items=res[1]||[], ings={};
    (res[2]||[]).forEach(function(i){ ings[i.id]=i; });
    var el=document.getElementById('prodBody');
    if(!prods.length){ el.innerHTML='<div class="card"><div class="empty"><div class="em-ic">🧁</div>ยังไม่มีสินค้า<br><br><button class="btn btn-p" onclick="prodForm()">เพิ่มสินค้าแรก</button></div></div>'; return; }
    el.innerHTML = prods.map(function(p){
      var cost = calcCost(p, items, ings);
      var margin = p.sell_price? (p.sell_price-cost.total) : 0;
      var fc = p.sell_price? Math.round(cost.ing/p.sell_price*100) : 0;
      return '<div class="card" onclick="nav(\'#/prod/'+p.id+'\')" style="cursor:pointer"><div class="row">'
        + '<div style="flex:1"><b>'+esc(p.name)+'</b><div class="help">ขาย ฿'+fmtMoney0(p.sell_price||0)+' · ต้นทุนรวม ฿'+fmtMoney(cost.total)+'</div></div>'
        + '<div style="text-align:right"><div class="'+(margin>=0?'pos':'neg')+'" style="font-weight:800">กำไร ฿'+fmtMoney(margin)+'</div>'
        + '<div class="help">Food cost '+fc+'%</div></div></div></div>';
    }).join('');
  });
};
function calcCost(p, items, ings){
  var ing=0;
  items.filter(function(it){ return it.product_id===p.id; }).forEach(function(it){
    var i=ings[it.ingredient_id]; if(!i) return;
    ing += (Number(it.qty)||0) * (Number(i.cost_per_use_unit)||0) * (1+(Number(it.waste_percent)||0)/100);
  });
  var total = ing + (Number(p.packaging_cost)||0) + (Number(p.labour_cost)||0) + (Number(p.overhead_cost)||0);
  if(p.gp_percent>0 && p.sell_price) total += p.sell_price*(p.gp_percent/100);
  return { ing:+ing.toFixed(2), total:+total.toFixed(2) };
}

  d=d||{};

    + '<div style="margin-top:14px"><button class="btn btn-p btn-block" onclick="saveProd(\''+(d.id||'')+'\')">💾 บันทึกสินค้า</button></div>');

function prodDetail(id){

  V('<div class="skel"></div>');
  Promise.all([
    api('products?select=*&id=eq.'+id),

    var items=res[1]||[], allIngs=res[2]||[], ings={};
    allIngs.forEach(function(i){ ings[i.id]=i; });
    var cost=calcCost(p,items,ings);
    var margin=(p.sell_price||0)-cost.total;
    var fc=p.sell_price? Math.round(cost.ing/p.sell_price*100):0;

    var h='<div class="card"><h2 style="font-size:19px">'+esc(p.name)+'</h2>'

var rpData=null;
function loadReport(){
  var from=document.getElementById('rp_from').value, to=document.getElementById('rp_to').value;
  document.getElementById('rpBody').innerHTML='<div class="skel"></div>';
  api('transactions?select=*&txn_date=gte.'+from+'&txn_date=lte.'+to+'&order=txn_date&limit=2000').then(function(rows){
    rows=rows||[]; rpData={rows:rows,from:from,to:to};
    var inc=0,exp=0,byCat={};
    rows.forEach(function(r){
      var isIn=(r.txn_type==='income'||r.txn_type==='sale'||r.txn_type==='transfer_in');
      var a=Number(r.amount)||0;
      if(isIn) inc+=a; else exp+=a;
      var k=(isIn?'รายรับ: ':'รายจ่าย: ')+(r.category_name||'ไม่ระบุ');
      byCat[k]=(byCat[k]||0)+a;
    });
    var h='<div class="card" id="printArea"><h2 style="font-size:17px">สรุปรายรับรายจ่าย</h2>'
      + '<div class="help">'+esc(S.store.name)+' · '+fmtDate(from)+' – '+fmtDate(to)+' · จัดทำ '+fmtDate(todayISO())+'</div>'
      + '<div class="grid3" style="margin-top:10px">'
      + '<div class="stat"><div class="lbl">รายรับ</div><div class="val pos" style="font-size:15px">฿'+fmtMoney0(inc)+'</div></div>'
      + '<div class="stat"><div class="lbl">รายจ่าย</div><div class="val neg" style="font-size:15px">฿'+fmtMoney0(exp)+'</div></div>'
      + '<div class="stat"><div class="lbl">กำไร</div><div class="val '+(inc-exp>=0?'pos':'neg')+'" style="font-size:15px">฿'+fmtMoney0(inc-exp)+'</div></div></div>'
      + '<table class="rep" style="margin-top:12px"><tr><th>หมวด</th><th class="num">ยอดรวม</th></tr>'
      + Object.keys(byCat).sort().map(function(k){ return '<tr><td>'+esc(k)+'</td><td class="num">฿'+fmtMoney(byCat[k])+'</td></tr>'; }).join('')
      + '</table>'
      + '<div class="help" style="margin-top:10px">'+rows.length+' รายการ · ตัวเลขนี้เป็นข้อมูลเบื้องต้นสำหรับส่งต่อนักบัญชี ไม่ใช่งบการเงินตามมาตรฐานบัญชี</div></div>'
      + '<div class="card no-print"><b>Export</b>'
      + '<button class="btn btn-p btn-block" style="margin-top:10px" onclick="expSheet()">📤 Export / ซิงก์ Drive (รายงานสรุป)</button>'
      + '<button class="btn btn-s btn-block" style="margin-top:8px" onclick="rdSheet()">🧾 รายงานเงินสดรับ-จ่าย (แบบยื่นสรรพากร)</button>'
      + '<div class="help" style="margin-top:8px">PDF: กด "🖨 PDF" แล้วเลือก "บันทึกเป็น PDF" ในหน้าจอพิมพ์ของมือถือ · แนะนำอัปโหลดไฟล์ที่ได้ไปเก็บในโฟลเดอร์ 09_Exports บน Google Drive</div></div>';
    document.getElementById('rpBody').innerHTML=h;
  }).catch(function(){ document.getElementById('rpBody').innerHTML='<div class="card"><div class="empty">โหลดไม่สำเร็จ<br><button class="btn btn-s" style="margin-top:8px" onclick="loadReport()">ลองอีกครั้ง</button></div></div>'; });

function rpRows(){
  return (rpData.rows||[]).map(function(r){
    var isIn=(r.txn_type==='income'||r.txn_type==='sale'||r.txn_type==='transfer_in');
    return {
      'วันที่':r.txn_date, 'ประเภท':isIn?'รายรับ':'รายจ่าย', 'ประเภทย่อย':r.txn_type,
      'หมวดหมู่':r.category_name||'', 'คู่ค้า':r.party_name||'',
      'จำนวนเงิน':Number(r.amount)||0, 'VAT':Number(r.vat_amount)||0,
      'ก่อน VAT':r.before_vat!=null?Number(r.before_vat):'',
      'วิธีชำระ':payName(r.payment_method), 'ช่องทาง':r.channel||'',
      'เลขเอกสาร':r.doc_no||'', 'เลขผู้เสียภาษี':r.tax_id||'',
      'รายละเอียด':r.description||'', 'หมายเหตุ':r.note||'',
      'สถานะตรวจ':r.review_status||'', 'มีหลักฐาน':r.document_id?'มี':'ไม่มี',
      'บันทึกโดย':r.created_by||'', 'ID':r.id
    };
  });
}
function expXlsx(){
  if(!rpData){ toast('สร้างรายงานก่อน'); return; }
  try{
    var wb=XLSX.utils.book_new();
    var ws=XLSX.utils.json_to_sheet(rpRows());
    ws['!cols']=[{wch:11},{wch:8},{wch:10},{wch:16},{wch:18},{wch:11},{wch:8},{wch:10},{wch:9},{wch:10},{wch:12},{wch:14},{wch:24},{wch:16},{wch:9},{wch:8},{wch:10},{wch:36}];
    XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
    var inc=0,exp=0; rpData.rows.forEach(function(r){ var i=(r.txn_type==='income'||r.txn_type==='sale'||r.txn_type==='transfer_in'); if(i)inc+=Number(r.amount)||0; else exp+=Number(r.amount)||0; });
    var sum=XLSX.utils.json_to_sheet([
      {'รายการ':'ร้าน','ค่า':S.store.name},{'รายการ':'ช่วงวันที่','ค่า':rpData.from+' ถึง '+rpData.to},
      {'รายการ':'รายรับรวม','ค่า':inc},{'รายการ':'รายจ่ายรวม','ค่า':exp},{'รายการ':'กำไรเบื้องต้น','ค่า':inc-exp},
      {'รายการ':'จำนวนรายการ','ค่า':rpData.rows.length},{'รายการ':'จัดทำเมื่อ','ค่า':new Date().toISOString()}
    ]);
    XLSX.utils.book_append_sheet(wb, sum, 'Summary');
    XLSX.writeFile(wb, 'report_'+rpData.from+'_'+rpData.to+'.xlsx');
    driveAsk('report_'+rpData.from+'_'+rpData.to+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', XLSX.write(wb,{bookType:'xlsx',type:'base64'}));
    audit('export','report',null,{type:'xlsx',from:rpData.from,to:rpData.to});
  }catch(e){ toast('Export ไม่สำเร็จ: '+e.message); }
}
function expCsv(){
  if(!rpData){ toast('สร้างรายงานก่อน'); return; }
  var rows=rpRows(); if(!rows.length){ toast('ไม่มีข้อมูล'); return; }
  var keys=Object.keys(rows[0]);
  var csv='﻿'+keys.join(',')+String.fromCharCode(10)+rows.map(function(r){
    return keys.map(function(k){ var v=String(r[k]==null?'':r[k]); return '"'+v.replace(/"/g,'""')+'"'; }).join(',');
  }).join(String.fromCharCode(10));
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='report_'+rpData.from+'_'+rpData.to+'.csv'; a.click();
  driveAsk('report_'+rpData.from+'_'+rpData.to+'.csv','text/csv', btoa(unescape(encodeURIComponent(csv))));
  audit('export','report',null,{type:'csv'});
}

function syncDriveNow(btn){

    var res=document.getElementById('syncResult');

};
function aiPush(html){ var l=document.getElementById('aiLog'); if(l){ l.innerHTML += html; } }
function aiSend(){
  var inp=document.getElementById('aiCmd'); var cmd=inp.value.trim(); if(!cmd) return;
  inp.value='';
  aiPush('<div style="text-align:right;margin:8px 0"><span style="background:#eaf4f0;padding:8px 12px;border-radius:12px;display:inline-block">'+esc(cmd)+'</span></div>');
  aiPush('<div class="help" id="aiWait">🤖 กำลังคิด...</div>');
  aiBuildContext().then(function(summary){
    return fetch(CFG.fnUrl+'/assistant',{method:'POST',headers:{'apikey':CFG.key,'Authorization':'Bearer '+CFG.key,'Content-Type':'application/json'},
      body:JSON.stringify({command:cmd,today:todayISO(),categories:S.cats.map(function(c){return c.name_th;}),summary:summary})});
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })

    var w=document.getElementById('aiWait'); if(w) w.remove();
    if(!res.ok||res.j.error) throw new Error(res.j.error||'ผิดพลาด');

      var t=d.transaction; window.__aiTxn=t;

        +'<table class="rep" style="margin-top:6px">'
        +trRow('ประเภท', (t.txn_type==='income'||t.txn_type==='sale')?'รายรับ':'รายจ่าย')

        +trRow('หมวด', t.category_name)+trRow('คู่ค้า', t.party_name)+trRow('รายละเอียด', t.description)
        +'</table><div class="grid2" style="margin-top:8px"><button class="btn btn-t" onclick="aiCancel()">ยกเลิก</button>'
        +'<button class="btn btn-p" onclick="aiConfirm(this)">✓ บันทึกตามนี้</button></div></div>');
    } else if(d.action==='add_ingredient' && d.ingredient){
      var g=d.ingredient; window.__aiIng=g;
      var unitCost=(g.pack_price!=null && g.units_per_pack)? (Number(g.pack_price)/Number(g.units_per_pack)) : null;
      aiPush('<div class="card" style="background:#f2f8f5"><b>เพิ่มวัตถุดิบนี้?</b>'
        +'<table class="rep" style="margin-top:6px">'
        +trRow('ชื่อวัตถุดิบ', g.name_th)
        +trRow('หน่วยที่ซื้อ', g.buy_unit)
        +trRow('ได้ปริมาณ', (g.units_per_pack!=null? g.units_per_pack+' '+(g.use_unit||''):null))
        +trRow('ราคาซื้อ', g.pack_price!=null? '฿'+fmtMoney(g.pack_price):null)
        +trRow('ต้นทุนต่อ'+(g.use_unit||'หน่วย'), unitCost!=null? '฿'+unitCost.toFixed(4):null)
        +trRow('แหล่งซื้อ', g.source)
        +'</table>'
        +(g.pack_price==null? '<div class="help" style="color:#96700f;margin-top:4px">⚠️ ยังไม่มีราคา — บันทึกได้ แล้วค่อยเติมราคาทีหลังในหน้าวัตถุดิบ</div>':'')
        +'<div class="grid2" style="margin-top:8px"><button class="btn btn-t" onclick="aiCancel()">ยกเลิก</button>'
        +'<button class="btn btn-p" onclick="aiConfirmIng(this)">✓ บันทึกวัตถุดิบ</button></div></div>');
    } else if(d.action==='add_recipe' && d.recipe){
      var rc=d.recipe; window.__aiRecipe=rc;
      var ry=Number(rc.yield_units)||1; var rtot=0; var rmiss=0; var rrows='';
      (rc.ingredients||[]).forEach(function(it){
        var cpu=(it.pack_price!=null&&Number(it.units_per_pack))? Number(it.pack_price)/Number(it.units_per_pack) : null;
        var per=+(Number(it.qty_used||0)/ry).toFixed(2);
        if(cpu!=null){ rtot+=cpu*Number(it.qty_used||0); } else { rmiss++; }
        rrows+='<tr><td>'+esc(it.name_th||'')+'</td><td style="text-align:right">'+per+' '+esc(it.use_unit||'')+'/ชิ้น</td><td style="text-align:right">'+(cpu!=null? '฿'+(cpu*per).toFixed(2):'—')+'</td></tr>';
      });
      aiPush('<div class="card" style="background:#f2f8f5"><b>บันทึกสูตรนี้?</b>'
        +'<table class="rep" style="margin-top:6px">'
        +trRow('สินค้า', rc.product_name)
        +trRow('สูตรเต็มได้', ry+' ชิ้น')
        +trRow('ราคาขาย', rc.sell_price!=null? '฿'+fmtMoney(rc.sell_price):null)
        +'</table><table class="rep" style="margin-top:6px"><tr><th style="text-align:left">วัตถุดิบ</th><th style="text-align:right">ต่อชิ้น</th><th style="text-align:right">ต้นทุน</th></tr>'+rrows+'</table>'
        +'<div class="help" style="margin-top:4px">ต้นทุนวัตถุดิบ ≈ ฿'+(rtot/ry).toFixed(2)+'/ชิ้น (฿'+rtot.toFixed(2)+'/สูตรเต็ม)'+(rmiss? ' · '+rmiss+' รายการยังไม่มีราคา — บันทึกได้ แล้วค่อยเติมราคาทีหลัง':'')+'</div>'
        +'<div class="grid2" style="margin-top:8px"><button class="btn btn-t" onclick="aiCancel()">ยกเลิก</button>'
        +'<button class="btn btn-p" onclick="aiConfirmRecipe(this)">✓ บันทึกสูตร</button></div></div>');
    } else if(d.answer){
      aiPush('<div style="margin:8px 0"><span style="background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:12px;display:inline-block">🤖 '+esc(d.answer)+'</span></div>');
    } else {
      aiPush('<div class="help">🤖 ยังไม่เข้าใจคำสั่งนี้ ลองพิมพ์ใหม่ เช่น "บันทึกรายจ่ายค่าไฟ 800 บาทวันนี้"</div>');
    }
  }).catch(function(e){
    var w=document.getElementById('aiWait'); if(w) w.remove();
    aiPush('<div class="badge b-err" style="margin:6px 0">'+esc(e.message.slice(0,150))+'</div>');
  });
}
function aiCancel(){ window.__aiTxn=null; window.__aiIng=null; window.__aiRecipe=null; aiPush('<div class="help">ยกเลิกแล้ว ไม่มีการบันทึก</div>'); }

  var t=window.__aiTxn; if(!t){ toast('ไม่มีรายการรอยืนยัน'); return; }

routes.check = function(){
  setTop('ตรวจสอบข้อมูล / ปิดเดือน', true);
  V('<div class="skel"></div><div class="skel"></div>');
  var m = monthStartISO();
  Promise.all([
    api('transactions?select=id,txn_type,txn_date,amount,party_name,category_name,review_status,document_id&order=txn_date.desc&limit=1000'),
    api('documents?select=id,file_name,status,ocr_status,created_at&order=created_at.desc&limit=200')
  ]).then(function(res){
    var txns=res[0]||[], docs=res[1]||[];
    var map={}, dups=[];
    txns.forEach(function(r){ var k=r.txn_date+'|'+r.amount+'|'+r.txn_type; (map[k]=map[k]||[]).push(r); });
    Object.keys(map).forEach(function(k){ if(map[k].length>1) dups.push(map[k]); });
    var noDoc = txns.filter(function(r){ var i=(r.txn_type==='income'||r.txn_type==='sale'||r.txn_type==='transfer_in'); return !i && !r.document_id && r.txn_date>=m; });
    var pending = txns.filter(function(r){ return r.review_status==='pending'; });
    var inboxDocs = docs.filter(function(d){ return d.status!=='linked'; });
    var failedOcr = docs.filter(function(d){ return d.ocr_status==='failed'; });
    function ckItem(ok, name, detail){ return '<div class="item"><div class="ic '+(ok?'ic-in':'ic-ex')+'">'+(ok?'✅':'⚠️')+'</div><div class="main"><div class="t1">'+name+'</div><div class="t2">'+detail+'</div></div></div>'; }
    var h='<div class="card"><b>✅ Checklist ปิดเดือน (ตั้งแต่ '+fmtDate(m)+')</b>'
      + ckItem(pending.length===0,'ตรวจสอบรายการทั้งหมด', pending.length===0?'ไม่มีรายการค้างตรวจ':pending.length+' รายการรอตรวจ — เปิดดูจากหน้ารายการ')
      + ckItem(noDoc.length===0,'แนบหลักฐานรายจ่าย', noDoc.length===0?'รายจ่ายเดือนนี้มีหลักฐานครบ':noDoc.length+' รายการไม่มีหลักฐานแนบ')
      + ckItem(inboxDocs.length===0,'เชื่อมเอกสารกับรายการ', inboxDocs.length===0?'เอกสารเชื่อมครบทุกไฟล์':inboxDocs.length+' เอกสารยังอยู่ใน Inbox')
      + ckItem(failedOcr.length===0,'OCR เอกสาร', failedOcr.length===0?'ไม่มีเอกสาร OCR ล้มเหลว':failedOcr.length+' เอกสาร OCR ล้มเหลว — อ่านใหม่หรือกรอกเอง')
      + ckItem(dups.length===0,'รายการซ้ำ', dups.length===0?'ไม่พบรายการที่น่าจะซ้ำ':dups.length+' กลุ่มที่อาจซ้ำ (ดูด้านล่าง)')
      + '<div class="help" style="margin-top:8px">เมื่อครบทุกข้อ: ไปหน้า รายงานและ Export → เลือกทั้งเดือน → Export Excel ส่งนักบัญชี แล้วเก็บสำเนาที่โฟลเดอร์ 09_Exports บน Google Drive</div></div>';
    if(dups.length){
      h+='<div class="card"><b>รายการที่อาจซ้ำ ('+dups.length+' กลุ่ม)</b><div class="help">ระบบไม่ลบให้อัตโนมัติ — กดเข้าไปดูแล้วตัดสินใจเอง</div>';
      dups.slice(0,20).forEach(function(g){
        var same = g[0].party_name && g.every(function(x){ return x.party_name===g[0].party_name; });
        var lv = same? '<span class="badge b-err">โอกาสสูง</span>' : '<span class="badge b-warn">ปานกลาง</span>';
        h+='<div style="border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px">'+lv+' '+fmtDate(g[0].txn_date)+' · ฿'+fmtMoney0(g[0].amount);
        g.forEach(function(r){ h+=txnItem(r); });
        h+='</div>';
      });
      h+='</div>';
    }
    if(noDoc.length){
      h+='<div class="card"><b>รายจ่ายเดือนนี้ที่ไม่มีหลักฐาน ('+noDoc.length+')</b>'+noDoc.slice(0,20).map(txnItem).join('')+'</div>';
    }
    V(h);
  }).catch(function(){ V('<div class="card"><div class="empty">โหลดไม่สำเร็จ<br><button class="btn btn-s" style="margin-top:8px" onclick="render()">ลองอีกครั้ง</button></div></div>'); });
};

/* ================== LOGIN GATE ================== */
function gate(){
  var sys = localStorage.getItem('sa_system') || 'backoffice';
  S.system = sys;
  var authOk = localStorage.getItem('sa_auth_ok')==='1';
  if(authOk && S.user){
    var seg0 = (location.hash.replace('#','').split('/').filter(Boolean))[0];
    if(sys==='pos' && seg0!=='pos'){ location.hash='/pos'; }
    else if(sys!=='pos' && seg0==='pos'){ location.hash='/home'; }
    render();
    return;
  }
  if(authOk){ gateUsers(); return; }
  gateChooseSystem();
}
function gateChooseSystem(){
  var old=document.getElementById('gateBg'); if(old) old.remove();
  var bg=document.createElement('div'); bg.id='gateBg';
  bg.style.cssText='position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px';
  bg.innerHTML='<div style="max-width:340px;width:100%;text-align:center">'
    +'<h2 style="margin:8px 0">Brunswick OS</h2>'
    +'<div class="help" style="margin-bottom:14px">เลือกระบบที่ต้องการเข้าใช้งาน</div>'
    +'<div style="text-align:left">'
    +'<div class="card" style="cursor:pointer;margin-bottom:8px" onclick="gatePickSystem(\'pos\')"><div class="row"><span style="font-size:22px">🧾</span><div style="margin-left:10px;min-width:0"><b>ระบบหน้าร้าน (POS)</b><div class="help" style="margin:0">เปิดบิล เลือกเมนู พิมพ์ใบเสร็จ</div></div></div></div>'
    +'<div class="card" style="cursor:pointer" onclick="gatePickSystem(\'backoffice\')"><div class="row"><span style="font-size:22px">📊</span><div style="margin-left:10px;min-width:0"><b>ระบบบัญชีหลังบ้าน</b><div class="help" style="margin:0">รายรับ-รายจ่าย ต้นทุน รายงาน</div></div></div></div>'
    +'</div></div>';
  document.body.appendChild(bg);
}
function gatePickSystem(sys){ S.system=sys; gatePin(); }
function gatePin(){
  var bg=document.getElementById('gateBg'); if(!bg) return;
  var label = S.system==='pos' ? 'ระบบหน้าร้าน (POS)' : 'ระบบบัญชีหลังบ้าน';
  bg.innerHTML='<div style="max-width:340px;width:100%;text-align:center">'
    +'<div style="font-size:44px">🔒</div><h2 style="margin:8px 0">'+esc(label)+'</h2>'
    +'<div class="help" style="margin-bottom:10px">ใส่รหัสผ่านระบบเพื่อเข้าใช้งาน</div>'
    +'<input type="password" inputmode="numeric" id="gatePin" placeholder="รหัสผ่าน" style="text-align:center;font-size:22px;letter-spacing:6px">'
    +'<div id="gateErr" class="help" style="color:var(--red);margin-top:6px"></div>'
    +'<button class="btn btn-p btn-block" style="margin-top:12px" onclick="gatePinOk()">เข้าสู่ระบบ</button>'
    +'<div class="help" style="margin-top:14px;cursor:pointer;text-decoration:underline" onclick="gateChooseSystem()">‹ กลับไปเลือกระบบ</div>'
    +'</div>';
  var i=document.getElementById('gatePin');
  if(i){ i.focus(); i.addEventListener('keydown', function(e){ if(e.key==='Enter') gatePinOk(); }); }
}
function gatePinOk(){
  var v=(document.getElementById('gatePin')||{value:''}).value.trim();
  var expected = S.system==='pos' ? ((S.auth && S.auth.pos_pin)? String(S.auth.pos_pin) : '1234') : ((S.auth && S.auth.pin)? String(S.auth.pin) : '1234');
  if(v!==expected){ var er=document.getElementById('gateErr'); if(er) er.textContent='รหัสไม่ถูกต้อง ลองอีกครั้ง'; return; }
  localStorage.setItem('sa_auth_ok','1');
  localStorage.setItem('sa_system', S.system);
  gateUsers();
}
function gateUsers(){
  var bg=document.getElementById('gateBg'); if(!bg) return;
  bg.innerHTML='<div class="help" style="text-align:center">กำลังโหลดรายชื่อ...</div>';
  api('transactions?select=created_by&limit=1000').then(function(rows){
    var names={};
    (rows||[]).forEach(function(r){ if(r.created_by && r.created_by!=='unknown' && r.created_by!=='claude-test') names[r.created_by]=1; });
    ((S.auth && S.auth.users)||[]).forEach(function(n){ names[n]=1; });
    if(S.user) names[S.user]=1;
    var list=Object.keys(names).sort();
    var sysLabel = S.system==='pos' ? 'ระบบหน้าร้าน (POS)' : 'ระบบบัญชีหลังบ้าน';
    bg.innerHTML='<div style="max-width:340px;width:100%;text-align:center">'

/* ================== AI RICH CONTEXT ================== */
function aiBuildContext(){
  var m = monthStartISO();
  var d0 = new Date(); var pm = new Date(d0.getFullYear(), d0.getMonth()-1, 1);
  var pmStart = pm.getFullYear()+'-'+String(pm.getMonth()+1).padStart(2,'0')+'-01';
  return Promise.all([
    api('transactions?select=txn_type,amount,category_name,txn_date,review_status,document_id&txn_date=gte.'+pmStart+'&limit=2000'),
    api('products?select=*&active=eq.true&limit=100'),
    api('recipe_items?select=*&limit=500'),
    api('ingredients?select=id,name_th,buy_unit,use_unit,conversion,last_price,cost_per_use_unit,source&active=eq.true&limit=200'),
    api('ingredient_prices?select=ingredient_id,price,purchase_date,supplier_name&order=purchase_date.desc&limit=100'),
    count('documents','status=neq.linked')
  ]).then(function(res){
    var txns=res[0]||[], prods=res[1]||[], items=res[2]||[], ings=res[3]||[], prices=res[4]||[], inboxDocs=res[5];
    var ingMap={}; ings.forEach(function(i){ ingMap[i.id]=i; });
    var cur={inc:0,exp:0,byCat:{}}, prev={inc:0,exp:0,byCat:{}};
    var pending=0, noDoc=0;
    txns.forEach(function(r){
      var g = r.txn_date>=m ? cur : prev;
      var isIn=(r.txn_type==='income'||r.txn_type==='sale'||r.txn_type==='transfer_in');
      var a=Number(r.amount)||0;
      if(isIn) g.inc+=a; else { g.exp+=a; var k=r.category_name||'other'; g.byCat[k]=(g.byCat[k]||0)+a; }
      if(r.txn_date>=m){ if(r.review_status==='pending') pending++; if(!isIn && !r.document_id) noDoc++; }
    });
    var prodInfo = prods.map(function(p){
      var c=calcCost(p, items, ingMap);
      return { name:p.name, sell_price:p.sell_price, ingredient_cost:c.ing, total_cost:c.total,
        profit_per_unit:+(((p.sell_price||0)-c.total).toFixed(2)),
        recipe: items.filter(function(it){ return it.product_id===p.id; }).map(function(it){ var i=ingMap[it.ingredient_id]||{}; return (i.name_th||'?')+' '+it.qty+' '+(it.unit||i.use_unit||''); }) };
    });
    var priceHist={};
    prices.forEach(function(p){ var i=ingMap[p.ingredient_id]; if(!i) return; var arr=(priceHist[i.name_th]=priceHist[i.name_th]||[]); if(arr.length<5) arr.push({price:Number(p.price), date:p.purchase_date, from:p.supplier_name||null}); });
    return 'This month totals: income '+cur.inc+', expense '+cur.exp+', expense by category '+JSON.stringify(cur.byCat)
      +'. Last month totals: income '+prev.inc+', expense '+prev.exp+', by category '+JSON.stringify(prev.byCat)
      +'. Month-end pending tasks: '+pending+' transactions awaiting review, '+noDoc+' expenses without receipt this month, '+inboxDocs+' uploaded documents not yet linked to any transaction'
      +'. Products with computed costs: '+JSON.stringify(prodInfo)
      +'. Ingredients (per-use-unit cost): '+JSON.stringify(ings.map(function(i){ return {name:i.name_th, last_buy_price:i.last_price, buy_unit:i.buy_unit, cost_per_unit:i.cost_per_use_unit, unit:i.use_unit, usual_source:i.source||null}; }))
      +'. Recent purchase price history (newest first): '+JSON.stringify(priceHist);
  }).catch(function(){
    return 'Business data unavailable right now.';
  });
}

function tgtCalcFor(p, cfg, items, ings){
  var sp=Number(p.sell_price)||0; if(sp<=0) return null;
  var c=calcCost(p, items, ings);
  var fromRecipe = c.total>0;
  var cost = fromRecipe? c.total : +(sp*((Number(cfg.fc)||35)/100)).toFixed(2);
  var contr = +(sp-cost).toFixed(2);
  var F = (Number(cfg.salary)||0)+(Number(cfg.fixed)||0)+(Number(cfg.profit)||0);
  if(contr<=0) return {sp:sp,cost:cost,contr:contr,F:F,be:null,fromRecipe:fromRecipe};
  var be=Math.ceil(F/contr);
  return {sp:sp,cost:cost,contr:contr,F:F,be:be,beRev:Math.round(be*sp),fromRecipe:fromRecipe};
}

function thaiNum(num){
  var t=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
  var p=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  if(num===0) return '';
  if(num>=1000000) return thaiNum(Math.floor(num/1000000))+'ล้าน'+thaiNum(num%1000000);
  var s='',str=String(num),len=str.length;
  for(var i=0;i<len;i++){
    var d=Number(str.charAt(i)); if(!d) continue;
    var pos=len-i-1;
    if(pos===1&&d===1) s+='สิบ';
    else if(pos===1&&d===2) s+='ยี่สิบ';
    else if(pos===0&&d===1&&len>1) s+='เอ็ด';
    else s+=t[d]+p[pos];
  }
  return s;
}
function thaiBaht(n){
  n=Math.round(Number(n)*100)/100;
  var b=Math.floor(n), st=Math.round((n-b)*100);
  var s=(b===0?'ศูนย์':thaiNum(b))+'บาท';
  s+= st? thaiNum(st)+'สตางค์' : 'ถ้วน';
  return s;
}
function cvFitText(c,text,cx,y,maxW,maxPx,minPx,bold){
  var px=maxPx;
  c.textAlign='center';
  while(px>minPx){
    c.font=(bold?'bold ':'')+px+'px sans-serif';
    if(c.measureText(text).width<=maxW) break;
    px--;
  }
  c.font=(bold?'bold ':'')+px+'px sans-serif';
  c.fillText(text,cx,y);
  return px;
}
function cvWrap(c,text,x,y,maxW,lh){
  var s=String(text||''), lineTxt='';
  for(var i=0;i<s.length;i++){
    var test=lineTxt+s.charAt(i);
    if(c.measureText(test).width>maxW && lineTxt){ c.fillText(lineTxt,x,y); y+=lh; lineTxt=s.charAt(i); }
    else lineTxt=test;
  }
  if(lineTxt) c.fillText(lineTxt,x,y);
  return y;
}

function exPick(el){ var box=document.getElementById('exTypes'); if(box){ Array.prototype.forEach.call(box.children,function(c){ c.classList.remove('on'); }); } el.classList.add('on'); if(window.__exOpt) window.__exOpt.type=el.getAttribute('data-t'); }
function exTgl(el,k){ var o=window.__exOpt||(window.__exOpt={type:'xlsx',dl:true,dr:true}); o[k]=!o[k]; el.classList.toggle('on'); if(!o.dl&&!o.dr){ o[k]=true; el.classList.add('on'); toast('ต้องเลือกอย่างน้อย 1 อย่าง'); } }

function expRun(btn){
  var o=window.__exOpt||{}; if(!rpData){ toast('สร้างรายงานก่อน'); return; }
  if(!o.dl&&!o.dr){ toast('เลือกอย่างน้อย 1 อย่าง'); return; }
  btn.disabled=true;
  var base='รายงานสรุป_'+rpData.from+'_ถึง_'+rpData.to;
  var MX='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  try{
    if(o.type==='xlsx'){
      var wb=XLSX.utils.book_new();
      var ws=XLSX.utils.json_to_sheet(rpRows());
      XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
      var inc=0,exp=0; rpData.rows.forEach(function(r){ var i=(r.txn_type==='income'||r.txn_type==='sale'||r.txn_type==='transfer_in'); if(i)inc+=Number(r.amount)||0; else exp+=Number(r.amount)||0; });
      var sm=XLSX.utils.json_to_sheet([{ 'รายการ':'ร้าน','ค่า':S.store.name },{ 'รายการ':'ช่วงวันที่','ค่า':rpData.from+' ถึง '+rpData.to },{ 'รายการ':'รายรับรวม','ค่า':inc },{ 'รายการ':'รายจ่ายรวม','ค่า':exp },{ 'รายการ':'กำไรเบื้องต้น','ค่า':inc-exp }]);
      XLSX.utils.book_append_sheet(wb, sm, 'Summary');
      if(o.dl) XLSX.writeFile(wb, base+'.xlsx');
      if(o.dr) driveUp(base+'.xlsx', MX, XLSX.write(wb,{bookType:'xlsx',type:'base64'}), 'รายงานสรุป');
    } else if(o.type==='csv'){
      var rows=rpRows(); if(!rows.length){ toast('ไม่มีข้อมูล'); btn.disabled=false; return; }
      var keys=Object.keys(rows[0]);
      var csv='﻿'+keys.join(',')+String.fromCharCode(10)+rows.map(function(r){ return keys.map(function(k){ var v=String(r[k]==null?'':r[k]); return '"'+v.replace(/"/g,'""')+'"'; }).join(','); }).join(String.fromCharCode(10));
      if(o.dl){ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=base+'.csv'; a.click(); }
      if(o.dr) driveUp(base+'.csv','text/csv', btoa(unescape(encodeURIComponent(csv))), 'รายงานสรุป');
    } else {
      if(o.dr){ var pa=document.getElementById('printArea'); var html='<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>'+base+'</title></head><body style="font-family:sans-serif">'+(pa?pa.outerHTML:'ไม่มีข้อมูล')+'</body></html>'; driveUp(base+'.html','text/html', btoa(unescape(encodeURIComponent(html))), 'รายงานสรุป'); }
      if(o.dl){ closeSheet(); audit('export','report',null,{type:'pdf'}); setTimeout(function(){ window.print(); },300); return; }
    }
    audit('export','report',null,{type:o.type,dl:!!o.dl,dr:!!o.dr});
    closeSheet(); if(o.dl) toast('ดาวน์โหลดแล้ว ✓');
  }catch(e){ btn.disabled=false; toast('ไม่สำเร็จ: '+e.message); }
}

function posLoad(){
  return Promise.all([
    api('pos_channels?select=*&active=eq.true&order=sort'),
    api('pos_categories?select=*&active=eq.true&order=sort'),
    api('pos_menu_items?select=*&active=eq.true&order=sort'),
    api('pos_menu_prices?select=*')
  ]).then(function(res){
    POS.channels = res[0]||[];
    POS.categories = res[1]||[];
    POS.items = res[2]||[];
    var pr = {};
    (res[3]||[]).forEach(function(p){ pr[p.menu_item_id+'|'+p.channel_id] = Number(p.price)||0; });
    POS.prices = pr;
    if(!POS.channelId && POS.channels[0]) POS.channelId = POS.channels[0].id;
    if(POS.cat!=='all' && !POS.categories.some(function(c){return c.id===POS.cat;})) POS.cat='all';
    POS.loaded = true;
  });
}
function posPrice(itemId){ return POS.prices[itemId+'|'+POS.channelId] || 0; }

  var billBody = {
    channel_id: POS.channelId, staff_name: S.user||'', customer_name: POS.custName||'',
    comment: POS.comment||'', subtotal: sub, total: sub, status:'closed', closed_at: new Date().toISOString(),
    cash_received: POS.cashReceived||null, change_due: (POS.cashReceived!=null? (POS.cashReceived-sub): null)
  };
  return api('pos_bills', {method:'POST', body: billBody, prefer:'return=representation'}).then(function(rows){
    var bill = rows && rows[0]; if(!bill) throw new Error('ไม่ได้รับข้อมูลบิลที่บันทึก');
    var items = POS.cart.map(function(c){ return {bill_id:bill.id, menu_item_id:c.menuId, item_name:c.name, unit_price:c.price, qty:c.qty, line_total:c.price*c.qty}; });
    return api('pos_bill_items', {method:'POST', body: items}).then(function(){
      audit('close','pos_bill', bill.id, {total:sub, channel: ch?ch.name:null});
      POS.lastBill = Object.assign({}, bill, {total:sub});
      POS.cart=[]; POS.custName=''; POS.comment='ขอบคุณที่อุดหนุนค่ะ 🙏'; POS.cashReceived=null; POS.previewBillNo=null;
      POS._sum=null; POS._sumDay=null; nav('/pos/done');
    });
  }).catch(function(e){ toast('บันทึกบิลไม่สำเร็จ: '+(e&&e.message||'ลองใหม่')); });
}
function posRenderDone(){
  setTop('บันทึกสำเร็จ');
  var b=POS.lastBill||{};
  V('<div style="text-align:center;padding:40px 20px 0">'
    +'<div style="width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">✓</div>'
    +'<b style="font-size:16px">บันทึกบิล #'+String(b.bill_no||'').padStart(4,'0')+' เรียบร้อย</b>'
    +'<p class="help">ยอดรวม '+fmtMoney(b.total||0)+' · บันทึกลงประวัติบิลแล้ว</p>'
    +'<button class="btn btn-s btn-block" style="margin-top:10px" onclick="posViewLastBill()">ดูใบเสร็จอีกครั้ง</button>'
    +'<button class="btn btn-p btn-block" style="margin-top:10px" onclick="nav(\'/pos\')">กลับหน้าหลัก</button>'
    +'</div>');
  posSetNavOn('pos');
}
function posViewLastBill(){ if(POS.lastBill) posRenderHistoryDetail(POS.lastBill.id); }

function posNameTag(n){
  var s=String(n||'').trim();
  if(!s) return '';
  return ' <span class="badge b-mut" style="font-weight:600;vertical-align:middle">'+esc(s.slice(0,8))+(s.length>8?'…':'')+'</span>';
}
function posRenderHistory(){
  setTop('ประวัติบิล', true);
  V('<div class="searchbar"><input id="posHistQ" placeholder="ค้นหาเลขบิล หรือชื่อลูกค้า..." value="'+esc(POS_HIST_Q)+'" oninput="posHistSearch(this.value)"></div>'
    +'<div class="chips" id="posHistChips"></div>'
    +'<div id="posHistList"></div>');
  posHistBuildChips();
  posHistLoad();
  posSetNavOn('poshistory');
}
function posHistBuildChips(){
  var c=document.getElementById('posHistChips'); if(!c) return;
  var defs=[['all','ทั้งหมด'],['closed','ชำระแล้ว'],['void','ยกเลิกแล้ว']];
  c.innerHTML = defs.map(function(d){ return '<button class="chip '+(POS_HIST_F===d[0]?'on':'')+'" onclick="posHistFilter(\''+d[0]+'\')">'+d[1]+'</button>'; }).join('');
}
function posHistFilter(f){ POS_HIST_F=f; posHistBuildChips(); posHistLoad(); }
function posHistSearch(v){ POS_HIST_Q=v; posHistLoad(); }
function posHistLoad(){
  var q = 'pos_bills?select=*,pos_channels(name)&order=closed_at.desc&limit=100';
  q += (POS_HIST_F==='all') ? '&status=neq.open' : '&status=eq.'+POS_HIST_F;
  api(q).then(function(rows){
    var list=document.getElementById('posHistList'); if(!list) return;
    var f=(rows||[]).filter(function(r){
      if(!POS_HIST_Q) return true;
      var s=POS_HIST_Q.toLowerCase();
      return String(r.bill_no).indexOf(s)>-1 || (r.customer_name||'').toLowerCase().indexOf(s)>-1;
    });
    if(!f.length){ list.innerHTML='<div class="empty"><div class="em-ic">🧾</div>ไม่พบบิลที่ตรงกับเงื่อนไข</div>'; return; }
    list.innerHTML = f.map(function(r){
      var badge = r.status==='void'? '<span class="badge b-err">ยกเลิกแล้ว</span>' : '<span class="badge b-ok">ชำระแล้ว</span>';
      return '<div class="item" style="cursor:pointer" onclick="posRenderHistoryDetail(\''+r.id+'\')">'
        +'<div class="ic ic-in">🧾</div><div class="main"><div class="t1">บิล #'+String(r.bill_no).padStart(4,'0')+posNameTag(r.customer_name)+'</div>'
        +'<div class="t2">'+fmtDate(r.closed_at)+' · '+(r.pos_channels?esc(r.pos_channels.name):'')+'</div></div>'
        +'<div style="text-align:right"><b>'+fmtMoney(r.total)+'</b><br>'+badge+'</div></div>';
    }).join('');
  }).catch(function(e){ toast('โหลดประวัติไม่สำเร็จ: '+(e&&e.message||'')); });
}
function posRenderHistoryDetail(id){
  setTop('ใบเสร็จ (ดูย้อนหลัง)', true);
  V('<div class="skel"></div>');
  Promise.all([
    api('pos_bills?select=*,pos_channels(name)&id=eq.'+id),
    api('pos_bill_items?select=*&bill_id=eq.'+id+'&order=created_at')
  ]).then(function(res){
    var b=(res[0]||[])[0]; var items=res[1]||[];
    if(!b){ V('<div class="empty">ไม่พบบิล</div>'); return; }
    POS_HIST_BILL = {bill:b, items:items};
    V('<div id="posReceipt" style="display:flex;justify-content:center;padding:14px 0;background:#e9ebee;border-radius:var(--radius)"></div>'
      +'<div style="padding:14px 0">'
      +'<button class="btn btn-s btn-block" onclick="posOpenPrint()">🖨 พิมพ์ / ส่งออก PDF</button>'
      +(b.status!=='void'? '<button class="btn btn-d btn-block" style="margin-top:8px" onclick="posVoidBill(\''+b.id+'\')">✕ ยกเลิกบิล (Void)</button>':'<div class="help" style="text-align:center;margin-top:8px">บิลนี้ถูกยกเลิกแล้ว</div>')
      +'<button class="btn btn-p btn-block" style="margin-top:8px" onclick="nav(\'/pos\')">กลับหน้าหลัก</button></div>');
    posDrawReceipt();
  }).catch(function(){ V('<div class="empty">โหลดบิลไม่สำเร็จ</div>'); });
  posSetNavOn('poshistory');
}
function posVoidBill(id){
  if(!confirm('ยกเลิกบิลนี้ใช่หรือไม่? บิลจะยังอยู่ในประวัติแต่จะถูกทำเครื่องหมายว่ายกเลิกแล้ว')) return;
  api('pos_bills?id=eq.'+id, {method:'PATCH', body:{status:'void'}}).then(function(){
    audit('void','pos_bill', id, {});
    POS._sum=null; POS._sumDay=null; toast('ยกเลิกบิลแล้ว');
    posRenderHistoryDetail(id);
  }).catch(function(e){ toast('ยกเลิกไม่สำเร็จ: '+(e&&e.message||'')); });
}

function posRenderMenu(){
  setTop('จัดการเมนู', true);
  if(POS_MG_CAT===null && POS.categories[0]) POS_MG_CAT=POS.categories[0].id;
  var chips = POS.categories.map(function(c){ return '<button class="chip '+(POS_MG_CAT===c.id?'on':'')+'" onclick="posMgCat(\''+c.id+'\')">'+esc(c.name)+'</button>'; }).join('')
    + '<button class="chip" onclick="posAddCategoryPrompt()">+ หมวดหมู่</button>';
  var curCat = POS.categories.find(function(x){return x.id===POS_MG_CAT;});
  var catEdit = curCat? '<div class="help" style="cursor:pointer;margin:10px 0 10px" onclick="posRenameCategory(\''+curCat.id+'\')">✎ แก้ไขชื่อหมวดหมู่นี้</div>' : '';
  var chanRows = POS.channels.map(function(c){ return '<div class="row" style="padding:4px 0"><span class="spacer">'+esc(c.name)+'</span><button class="btn-t" onclick="posRenameChannel(\''+c.id+'\')">✎</button></div>'; }).join('');
  V('<div class="chips">'+chips+'</div>'+catEdit+'<div id="posMgList"></div>'
    +'<button class="btn btn-p btn-block" style="margin-top:8px" onclick="posMenuModal(null)">+ เพิ่มเมนูใหม่</button>'
    +'<div class="card" style="margin-top:12px"><label style="margin-top:0">ช่องทางขาย</label>'+chanRows
    +'<button class="btn btn-t btn-block" style="margin-top:6px;border:1px dashed var(--line)" onclick="posAddChannelPrompt()">+ เพิ่มช่องทางขาย</button></div>');
  posMgRenderList();
  posSetNavOn('posmenu');
}
function posMgCat(id){ POS_MG_CAT=id; posRenderMenu(); }
function posMgRenderList(){
  var list=document.getElementById('posMgList'); if(!list) return;
  var rows = POS.items.filter(function(m){ return m.category_id===POS_MG_CAT; });
  if(!rows.length){ list.innerHTML='<div class="empty">ยังไม่มีเมนูในหมวดนี้</div>'; return; }
  list.innerHTML = rows.map(function(m){
    var prices = POS.channels.map(function(c){ return esc(c.name)+' '+fmtMoney0(POS.prices[m.id+'|'+c.id]||0); }).join(' · ');
    return '<div class="item"><div class="main"><div class="t1">'+esc(m.name)+'</div><div class="t2">'+prices+'</div></div>'
      +'<button class="btn-t" onclick="posMenuModal(\''+m.id+'\')">✎</button>'
      +'<button class="btn-t" style="color:var(--red)" onclick="posDeleteMenu(\''+m.id+'\')">🗑</button></div>';
  }).join('');
}
function posMenuModal(id){
  var m = id? POS.items.find(function(x){return x.id===id;}) : null;
  var priceFields = POS.channels.map(function(c){
    var v = m? (POS.prices[m.id+'|'+c.id]||0) : 0;
    return '<div><label>'+esc(c.name)+'</label><input type="number" id="posMfP_'+c.id+'" value="'+v+'"></div>';
  }).join('');
  var catOpts = POS.categories.map(function(c){ return '<option value="'+c.id+'" '+((m&&m.category_id===c.id)||(!m&&POS_MG_CAT===c.id)?'selected':'')+'>'+esc(c.name)+'</option>'; }).join('');
  sheet('<h3>'+(m?'แก้ไขเมนู':'เพิ่มเมนูใหม่')+'</h3>'
    +'<label>ชื่อเมนู</label><input id="posMfName" value="'+(m?esc(m.name):'')+'" placeholder="เช่น มัทฉะลาเต้">'
    +'<label>หมวดหมู่</label><select id="posMfCat">'+catOpts+'</select>'
    +'<label>ราคาตามช่องทาง</label><div class="grid3">'+priceFields+'</div>'
    +'<div class="row" style="gap:8px;margin-top:10px"><button class="btn btn-t" style="flex:1" onclick="closeSheet()">ยกเลิก</button><button class="btn btn-p" style="flex:1" onclick="posMenuSave('+(m?"'"+m.id+"'":'null')+')">บันทึก</button></div>');
}
function posMenuSave(id){
  var name=document.getElementById('posMfName').value.trim(); if(!name){ toast('กรอกชื่อเมนู'); return; }
  var cat=document.getElementById('posMfCat').value;
  var prices = POS.channels.map(function(c){ return {channel_id:c.id, price:Number(document.getElementById('posMfP_'+c.id).value)||0}; });
  var save = id
    ? api('pos_menu_items?id=eq.'+id, {method:'PATCH', body:{name:name, category_id:cat, updated_at:new Date().toISOString()}}).then(function(){ return id; })
    : api('pos_menu_items', {method:'POST', body:{name:name, category_id:cat}, prefer:'return=representation'}).then(function(rows){ return rows[0].id; });
  save.then(function(menuId){
    return Promise.all(prices.map(function(p){
      return api('pos_menu_prices?on_conflict=menu_item_id,channel_id', {method:'POST', body:{menu_item_id:menuId, channel_id:p.channel_id, price:p.price}, prefer:'resolution=merge-duplicates,return=representation'});
    }));
  }).then(function(){
    closeSheet(); toast('บันทึกเมนูแล้ว ✓'); POS.loaded=false; posLoad().then(function(){ POS_MG_CAT=cat; posRenderMenu(); });
  }).catch(function(e){ toast('บันทึกไม่สำเร็จ: '+(e&&e.message||'')); });
}
function posDeleteMenu(id){
  var m=POS.items.find(function(x){return x.id===id;});
  if(!confirm('ลบเมนู "'+(m?m.name:'')+'" ใช่หรือไม่?')) return;
  api('pos_menu_items?id=eq.'+id, {method:'DELETE'}).then(function(){
    toast('ลบเมนูแล้ว'); POS.loaded=false; posLoad().then(posRenderMenu);
  }).catch(function(e){ toast('ลบไม่สำเร็จ: '+(e&&e.message||'')); });
}
function posAddCategoryPrompt(){
  var name=prompt('ชื่อหมวดหมู่ใหม่'); if(!name) return;
  api('pos_categories', {method:'POST', body:{name:name.trim(), sort:POS.categories.length}}).then(function(){
    POS.loaded=false; posLoad().then(posRenderMenu);
  }).catch(function(e){ toast('เพิ่มหมวดหมู่ไม่สำเร็จ: '+(e&&e.message||'')); });
}
function posAddChannelPrompt(){
  var name=prompt('ชื่อช่องทางขายใหม่ เช่น Grab, LINE MAN'); if(!name) return;
  api('pos_channels', {method:'POST', body:{name:name.trim(), sort:POS.channels.length}}).then(function(){
    POS.loaded=false; posLoad().then(posRenderMenu); toast('เพิ่มช่องทางขายแล้ว ✓');
  }).catch(function(e){ toast('เพิ่มช่องทางไม่สำเร็จ: '+(e&&e.message||'')); });
}
function posRenameChannel(id){
  var c = POS.channels.find(function(x){return x.id===id;}); if(!c) return;
  var name = prompt('แก้ไขชื่อช่องทางขาย', c.name); if(!name || !name.trim()) return;
  api('pos_channels?id=eq.'+id, {method:'PATCH', body:{name:name.trim()}}).then(function(){
    POS.loaded=false; posLoad().then(posRenderMenu); toast('แก้ไขชื่อช่องทางขายแล้ว ✓');
  }).catch(function(e){ toast('แก้ไขไม่สำเร็จ: '+(e&&e.message||'')); });
}
function posRenameCategory(id){
  var c = POS.categories.find(function(x){return x.id===id;}); if(!c) return;
  var name = prompt('แก้ไขชื่อหมวดหมู่', c.name); if(!name || !name.trim()) return;
  api('pos_categories?id=eq.'+id, {method:'PATCH', body:{name:name.trim()}}).then(function(){
    POS.loaded=false; posLoad().then(posRenderMenu); toast('แก้ไขชื่อหมวดหมู่แล้ว ✓');
  }).catch(function(e){ toast('แก้ไขไม่สำเร็จ: '+(e&&e.message||'')); });
}

function posRenderSettings(){
  setTop('ตั้งค่าร้าน (หน้าร้าน)', true);
  var shop = S.pos_shop || {};
  V('<div class="card" style="padding:8px"><label>โลโก้ร้าน</label>'
    +'<div style="width:min(300px,100%);aspect-ratio:1/1;margin:0 auto;border-radius:16px;overflow:hidden;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;background:var(--bg)">'
    +(shop.logo_url? '<img src="'+shop.logo_url+'" style="width:100%;height:100%;object-fit:cover">' : '<span style="font-size:12px;color:var(--mut);text-align:center;padding:4px">ยังไม่มีโลโก้</span>')
    +'</div>'
    +'<div class="help" style="margin-top:6px">แนะนำรูปสี่เหลี่ยมจัตุรัส ขนาด 256×256px ขึ้นไป (ระบบจะครอบภาพเป็นสี่เหลี่ยมจัตุรัสอัตโนมัติ)</div>'
    +'<input type="file" id="posLogoInput" accept="image/*" style="margin-top:8px">'
    +'<label>ชื่อร้าน (แสดงบนใบเสร็จ)</label><input id="posShopName" value="'+esc(shop.name||S.store.name||'')+'" placeholder="ชื่อร้านของคุณ">'
    +'<label>ที่อยู่ใบเสร็จ</label><textarea id="posAddr" rows="2">'+esc(shop.address||'')+'</textarea>'
    +'<label>อื่นๆ (ไม่บังคับ)</label><textarea id="posMisc" rows="2">'+esc(shop.misc||'')+'</textarea>'
    +'<div class="grid2"><div><label>ขนาดกระดาษเริ่มต้น</label><select id="posPaperDef">'
    + Object.keys(POS_PAPER_W).map(function(p){ return '<option '+(shop.receipt_paper===p?'selected':'')+'>'+p+'</option>'; }).join('')
    +'</select></div><div><label>รหัสผ่านหน้าร้าน (POS)</label><input id="posPinInput" value="'+esc((S.auth&&S.auth.pos_pin)||'1234')+'"></div></div>'
    +'<button class="btn btn-p btn-block" style="margin-top:10px" onclick="posSaveSettings()">💾 บันทึกการตั้งค่า</button></div>'
    +'<div class="card"><div class="row"><div class="spacer"><b>รับเงิน / ทอนเงิน ในหน้าพรีวิว</b><div class="help">ปิดใช้งานเป็นค่าเริ่มต้น</div></div>'
    +'<input type="checkbox" id="posCashToggle" style="width:22px;height:22px" '+(shop.cash_enabled?'checked':'')+' onchange="posToggleCash(this.checked)"></div></div>'
    +'<div class="help" style="text-align:center;margin-top:14px"><a href="javascript:void(0)" onclick="logout()">ออกจากระบบ / สลับระบบ</a></div>');
  posSetNavOn('possettings');
  var li=document.getElementById('posLogoInput'); if(li) li.addEventListener('change', posLogoUpload);
}
function posSaveSettings(){
  var shop = Object.assign({}, S.pos_shop||{}, {
    name: document.getElementById('posShopName').value.trim(),
    address: document.getElementById('posAddr').value.trim(),
    misc: document.getElementById('posMisc').value.trim(),
    receipt_paper: document.getElementById('posPaperDef').value
  });
  S.pos_shop = shop;
  var pin = document.getElementById('posPinInput').value.trim();
  var a = S.auth||{}; if(pin) a.pos_pin = pin; S.auth=a;
  Promise.all([
    api('settings?key=eq.pos_shop', {method:'PATCH', body:{value:shop, updated_at:new Date().toISOString()}}),
    api('settings?key=eq.auth', {method:'PATCH', body:{value:a, updated_at:new Date().toISOString()}})
  ]).then(function(){ toast('บันทึกการตั้งค่าแล้ว ✓'); }).catch(function(){ toast('บันทึกไม่สำเร็จ'); });
}
function posToggleCash(v){
  S.pos_shop = Object.assign({}, S.pos_shop||{}, {cash_enabled:v});
  api('settings?key=eq.pos_shop', {method:'PATCH', body:{value:S.pos_shop, updated_at:new Date().toISOString()}})
    .then(function(){ toast(v?'เปิดใช้งานรับเงิน/ทอนเงินแล้ว':'ปิดใช้งานแล้ว'); }).catch(function(){ toast('บันทึกไม่สำเร็จ'); });
}
function posLogoUpload(e){
  var f=e.target.files[0]; if(!f) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var shop = Object.assign({}, S.pos_shop||{}, {logo_url: ev.target.result});
    S.pos_shop = shop;
    api('settings?key=eq.pos_shop', {method:'PATCH', body:{value:shop, updated_at:new Date().toISOString()}})
      .then(function(){ toast('อัปโหลดโลโก้แล้ว ✓'); posRenderSettings(); }).catch(function(){ toast('อัปโหลดไม่สำเร็จ'); });
  };
  reader.readAsDataURL(f);
}

boot();
</script>
</body>
</html>
